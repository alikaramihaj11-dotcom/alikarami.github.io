<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>پخش فیلم | MOVIELAND</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        
        body {
            background: linear-gradient(135deg, #0a0a12 0%, #050508 100%);
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            color: #fff;
            min-height: 100vh;
        }
        
        /* انیمیشن پس‌زمینه */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 30% 40%, rgba(229,50,60,0.08), transparent 80%);
            animation: pulse 8s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }
        
        /* هدر شیشه‌ای */
        .header {
            background: rgba(10, 10, 18, 0.85);
            backdrop-filter: blur(20px);
            padding: 16px 32px;
            border-bottom: 1px solid rgba(229, 50, 60, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header-in {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .logo:hover {
            transform: scale(1.02);
        }
        
        .logo-icon {
            font-size: 28px;
            filter: drop-shadow(0 0 10px rgba(229,50,60,0.5));
        }
        
        .logo-text {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #e5323c, #ff6b6b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .back-btn {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            padding: 8px 24px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-weight: 500;
        }
        
        .back-btn:hover {
            background: #e5323c;
            transform: translateX(-5px);
            border-color: #e5323c;
            box-shadow: 0 5px 20px rgba(229,50,60,0.3);
        }
        
        /* پخش‌کننده اصلی */
        .player-container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 25px;
        }
        
        .video-wrapper {
            position: relative;
            width: 100%;
            background: linear-gradient(145deg, #0f1220, #080b14);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 25px 45px -15px rgba(0,0,0,0.5);
            border: 1px solid rgba(229,50,60,0.2);
        }
        
        video {
            width: 100%;
            height: auto;
            max-height: 75vh;
            display: block;
            background: #000;
        }
        
        /* کنترل‌های سفارشی */
        .video-controls-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(0deg, rgba(0,0,0,0.8), transparent);
            padding: 20px;
            opacity: 0;
            transition: 0.3s;
        }
        
        .video-wrapper:hover .video-controls-overlay {
            opacity: 1;
        }
        
        /* اطلاعات فیلم */
        .movie-info {
            background: rgba(18, 20, 36, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 25px 30px;
            margin-top: 25px;
            border: 1px solid rgba(229,50,60,0.15);
            transition: 0.3s;
        }
        
        .movie-info h2 {
            color: #e5323c;
            font-size: 26px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .movie-info h2 i {
            font-size: 28px;
        }
        
        .movie-info p {
            color: #a0a8c0;
            line-height: 1.6;
            font-size: 14px;
        }
        
        .download-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.05);
            padding: 8px 20px;
            border-radius: 50px;
            margin-top: 15px;
            text-decoration: none;
            color: #ffc107;
            font-size: 13px;
            transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .download-link:hover {
            background: rgba(255,193,7,0.15);
            transform: translateY(-2px);
        }
        
        /* لودینگ پیشرفته */
        .loading-box {
            text-align: center;
            padding: 80px;
            background: rgba(18, 20, 36, 0.5);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            border: 1px solid rgba(229,50,60,0.15);
        }
        
        .loading-spinner {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;
            border: 3px solid rgba(229,50,60,0.2);
            border-top-color: #e5323c;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-box p {
            color: #8892b0;
            font-size: 14px;
        }
        
        /* خطا */
        .error-box {
            text-align: center;
            padding: 60px;
            background: rgba(229,50,60,0.1);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            border: 1px solid rgba(229,50,60,0.3);
        }
        
        .error-box h3 {
            color: #ff6b6b;
            font-size: 28px;
            margin-bottom: 15px;
        }
        
        .error-box p {
            color: #aaa;
            margin-bottom: 20px;
        }
        
        .retry-btn {
            background: linear-gradient(135deg, #e5323c, #ff5555);
            border: none;
            padding: 12px 32px;
            border-radius: 60px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .retry-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(229,50,60,0.4);
        }
        
        footer {
            text-align: center;
            padding: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: #5a6378;
            font-size: 12px;
        }
        
        /* ریسپانسیو */
        @media (max-width: 768px) {
            .header { padding: 12px 20px; }
            .logo-text { font-size: 18px; }
            .logo-icon { font-size: 24px; }
            .back-btn { padding: 6px 18px; font-size: 12px; }
            .player-container { margin: 20px auto; padding: 0 15px; }
            .movie-info h2 { font-size: 20px; }
            .movie-info { padding: 18px 22px; }
            .loading-box { padding: 50px; }
        }
        
        @media (max-width: 480px) {
            .movie-info h2 { font-size: 18px; }
            .video-wrapper { border-radius: 16px; }
        }
    </style>
</head>
<body>

<div class="bg-animation"></div>

<div class="header">
    <div class="header-in">
        <div class="logo" onclick="location.href='index.html'">
            <span class="logo-icon">🎬</span>
            <span class="logo-text">MOVIELAND</span>
        </div>
        <a href="javascript:history.back()" class="back-btn">← بازگشت</a>
    </div>
</div>

<div class="player-container" id="playerContainer">
    <div class="loading-box">
        <div class="loading-spinner"></div>
        <p>🎬 در حال آماده‌سازی پخش کننده...</p>
    </div>
</div>

<footer>© 2024 MOVIELAND | تجربه‌ای نو از سینما</footer>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const movieId = urlParams.get('id');
    const movieTitle = decodeURIComponent(urlParams.get('title') || 'فیلم');
    const API_URL = `https://provider.upera.tv/api/v1/ghost/get/watch/movie-hls/${movieId}/1`;
    
    async function startPlay() {
        const container = document.getElementById('playerContainer');
        
        if (!movieId) {
            container.innerHTML = `
                <div class="error-box">
                    <h3>❌ خطا</h3>
                    <p>شناسه فیلم یافت نشد</p>
                    <button class="retry-btn" onclick="location.href='index.html'">بازگشت به صفحه اصلی</button>
                </div>
            `;
            return;
        }
        
        try {
            container.innerHTML = `
                <div class="loading-box">
                    <div class="loading-spinner"></div>
                    <p>🎬 در حال دریافت لینک پخش...</p>
                </div>
            `;
            
            const response = await fetch(API_URL);
            const data = await response.json();
            
            let videoLink = data?.data?.video?.[0]?.video;
            
            if (videoLink) {
                container.innerHTML = `
                    <div class="video-wrapper">
                        <video controls autoplay>
                            <source src="${videoLink}" type="video/mp4">
                            مرورگر شما از پخش ویدیو پشتیبانی نمی‌کند.
                        </video>
                    </div>
                    <div class="movie-info">
                        <h2>
                            <span>🎬</span>
                            ${movieTitle}
                        </h2>
                        <p>در حال پخش... | کیفیت خودکار</p>
                        <a href="${videoLink}" target="_blank" class="download-link">
                            📥 دانلود مستقیم فیلم
                        </a>
                    </div>
                `;
                
                // پخش خودکار
                const video = document.querySelector('video');
                if (video) {
                    video.play().catch(e => console.log('Auto-play prevented:', e));
                }
            } else {
                container.innerHTML = `
                    <div class="error-box">
                        <h3>❌ خطا</h3>
                        <p>لینک پخش دریافت نشد</p>
                        <button class="retry-btn" onclick="location.reload()">تلاش مجدد</button>
                    </div>
                `;
            }
        } catch (error) {
            console.error('خطا:', error);
            container.innerHTML = `
                <div class="error-box">
                    <h3>❌ خطا در ارتباط با سرور</h3>
                    <p>لطفاً اتصال اینترنت خود را بررسی کنید</p>
                    <button class="retry-btn" onclick="location.reload()">تلاش مجدد</button>
                </div>
            `;
        }
    }
    
    startPlay();
</script>
</body>
</html>
